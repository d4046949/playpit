name: Docker Image CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  actions: write

jobs:

  provision:
    name: Wake up ACI instance
    runs-on: ubuntu-latest

    steps:
       - name: Login to Azure
         uses: azure/login@v3
         with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

       - name: Test GitHub App
         env:
            GH_APP_ID: ${{ secrets.GH_APP_ID }}
            GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
         run: |
          echo "GitHub App ID is configured: ${GH_APP_ID}"
          echo "Private key is configured: ${#GH_APP_PRIVATE_KEY} characters"
      
       - name: Install PyJWT
         run: |
          python -m pip install PyJWT cryptography
          
       - name: Generate GitHub App JWT
         id: app-jwt
         env:
          GH_APP_ID: ${{ secrets.GH_APP_ID }}
          GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
         run: |
          python - <<'PY'
          import os
          import time
          import jwt

          app_id = os.environ["GH_APP_ID"]
          private_key = os.environ["GH_APP_PRIVATE_KEY"]

          now = int(time.time())

          token = jwt.encode(
              {
                  "iat": now - 60,
                  "exp": now + 540,
                  "iss": app_id,
              },
              private_key,
              algorithm="RS256",
          )

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"token={token}\n")
          PY

       - name: Get GitHub App installation ID
         id: app-installation
         env:
          GH_TOKEN: ${{ github.token }}
          APP_JWT: ${{ steps.app-jwt.outputs.token }}
         run: |
          INSTALLATION_ID=$(gh api \
            --header "Authorization: Bearer $APP_JWT" \
            repos/${{ github.repository }}/installation \
            --jq .id)

          echo "installation-id=$INSTALLATION_ID" >> "$GITHUB_OUTPUT"
          echo "Installation ID: $INSTALLATION_ID"
          
       - name: Check Azure
         run: az account show

       - name: Get GitHub App installation token
         id: installation-token
         env:
          APP_JWT: ${{ steps.app-jwt.outputs.token }}
          INSTALLATION_ID: ${{ steps.app-installation.outputs.installation-id }}
         run: |
          TOKEN=$(curl -s \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $APP_JWT" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/app/installations/${INSTALLATION_ID}/access_tokens" \
            | python -c "import sys,json; print(json.load(sys.stdin)['token'])")

          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
          echo "Installation token obtained successfully"

       - name: Get runner registration token
         id: runner-token
         env:
            INSTALLATION_TOKEN: ${{ steps.installation-token.outputs.token }}
         run: |
            TOKEN=$(curl -s \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $INSTALLATION_TOKEN" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runners/registration-token" \
              | python -c "import sys,json; print(json.load(sys.stdin)['token'])")
        
            echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
            echo "Runner registration token obtained successfully"
            
       - name: Check Azure
         run: az account show

       - name: Create ACI runner
         env:
            RUNNER_TOKEN: ${{ steps.runner-token.outputs.token }}
         run: |
            IDENTITY_ID=$(az identity show --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} --name github-runner-identity --query id --output tsv)
        
            az container create --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} --name github-runner --image jrplaypitacr.azurecr.io/my-github-runner:aci-v5 --acr-identity "$IDENTITY_ID" --assign-identity "$IDENTITY_ID" --os-type Linux --restart-policy Never --cpu 1 --memory 2 --environment-variables GITHUB_URL="https://github.com/d4046949/playpit" RUNNER_TOKEN="$RUNNER_TOKEN" RUNNER_NAME="aci-runner" RUNNER_LABELS="self-hosted,linux,x64,dotnet10"
                
       - name: Check ACI configuration
         run: |
          az container show \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name github-runner \
            --query "containers[0].environmentVariables[].name" \
            --output tsv

       - name: Wait for ACI runner
         run: |
          echo "Waiting for ACI runner to register..."
        
          for i in {1..30}; do
            STATE=$(az container show \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --name github-runner \
              --query "instanceView.state" \
              --output tsv)
        
            echo "ACI state: $STATE"
        
            if [ "$STATE" = "Running" ]; then
              echo "ACI is running."
              exit 0
            fi
        
            sleep 2
          done
        
          echo "ACI did not reach Running state."
          az container logs \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --name github-runner
        
          exit 1


          - name: Confirm GitHub runner is online
            env:
              INSTALLATION_TOKEN: ${{ steps.installation-token.outputs.token }}
            run: |
              echo "Waiting for GitHub runner to register..."
          
              for i in {1..30}; do
                RUNNERS=$(curl -s \
                  -H "Accept: application/vnd.github+json" \
                  -H "Authorization: Bearer $INSTALLATION_TOKEN" \
                  -H "X-GitHub-Api-Version: 2026-03-10" \
                  "https://api.github.com/repos/${{ github.repository }}/actions/runners")
          
                ONLINE=$(echo "$RUNNERS" | python -c "
              import sys, json
              data = json.load(sys.stdin)
              print(any(
                  r['name'] == 'aci-runner' and r['status'] == 'online'
                  for r in data['runners']
              ))
              ")
          
                if [ "$ONLINE" = "True" ]; then
                  echo "GitHub runner is ONLINE."
                  exit 0
                fi
          
                echo "Runner not online yet..."
                sleep 2
              done
          
              echo "Runner did not register with GitHub."
              exit 1
                      
             #- name: Start ACI runner
             #  run: |
              #  az container start \
               #   --resource-group ${{secrets.AZURE_RESOURCE_GROUP}} \
                #  --name github-runner
          
  build:
    needs: provision
    runs-on: [self-hosted, dotnet10]
    name: Build and Push
    #runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Login to Azure
      uses: azure/login@v3
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    #- name: Login to Azure Container Registry
    #  run: |
     #   az acr login --name ${{ secrets.ACR_NAME }}

    #- name: Build Docker image
    #  run: |
    #    docker build \
    #      --file myplaypit/myplaypit/Dockerfile \
    #      --tag ${{ secrets.ACR_LOGIN_SERVER }}/myplaypit:${{ github.sha }} \
    #      myplaypit

    - name: Build and push Docker image
      run: |
        az acr build \
          --registry ${{ secrets.ACR_NAME }} \
          --image myplaypit:${{ github.sha }} \
          --file myplaypit/myplaypit/Dockerfile \
          myplaypit

    #- name: Push Docker image
    #  run: |
    #    docker push \
     #    ${{ secrets.ACR_LOGIN_SERVER }}/myplaypit:${{ github.sha }}


  deploy:
    name: Deploy to App Service
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: test

    permissions:
      id-token: write
      contents: read

    steps:
    - name: Login to Azure
      uses: azure/login@v3
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Diagnose Azure permissions
      run: |
        echo "=== Current identity ==="
        az account show \
          --query '{user:user, subscription:id, tenant:tenantId}' \
          -o json
    
        echo "=== Service principal ==="
        az ad sp show \
          --id "${{ secrets.AZURE_CLIENT_ID }}" \
          --query '{appId:appId, objectId:id, name:displayName}' \
          -o json
    
        echo "=== RBAC assignments ==="
        az role assignment list \
          --assignee "${{ secrets.AZURE_CLIENT_ID }}" \
          --all \
          --query '[].{role:roleDefinitionName,scope:scope,principalId:principalId}' \
          -o table
    
    - name: Check Azure identity
      run: az account show

    - name: Inspect Contributor role
      run: |
        az role definition list \
          --name Contributor \
          --query '[0].{name:roleName, actions:permissions[0].actions, notActions:permissions[0].notActions}' \
          -o json

    - name: Show target resource
      run: |
        echo "RG: ${{ secrets.AZURE_RESOURCE_GROUP }}"
        echo "WEBAPP: ${{ secrets.AZURE_WEBAPP_NAME }}"
    
        az resource show \
          --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
          --name "${{ secrets.AZURE_WEBAPP_NAME }}" \
          --resource-type "Microsoft.Web/sites" \
          --query '{id:id,name:name,type:type}' \
          -o json
          
    - name: Verify target App Service
      run: |
        az webapp show \
          --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
          --name "${{ secrets.AZURE_WEBAPP_NAME }}" \
          --query '{name:name,id:id,kind:kind}' \
          -o json
      
    - name: Test App Settings via ARM directly
      run: |
        az rest \
          --method POST \
          --url "https://management.azure.com/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${{ secrets.AZURE_RESOURCE_GROUP }}/providers/Microsoft.Web/sites/${{ secrets.AZURE_WEBAPP_NAME }}/config/appsettings/list?api-version=2025-05-01"

    - name: Test App Service access
      run: |
        az webapp config appsettings list \
          --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
          --name "${{ secrets.AZURE_WEBAPP_NAME }}" \
          --output none

    - name: Update App Service container
      run: |
        az webapp config container set \
          --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
          --name "${{ secrets.AZURE_WEBAPP_NAME }}" \
          --container-image-name "${{ secrets.ACR_LOGIN_SERVER }}/myplaypit:${{ github.sha }}"
