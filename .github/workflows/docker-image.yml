name: Docker Image CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  id-token: write
  contents: read

jobs:

  build:
    name: Build and Push
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Login to Azure
      uses: azure/login@v3
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Login to Azure Container Registry
      run: |
        az acr login --name ${{ secrets.ACR_NAME }}

    - name: Build Docker image
      run: |
        docker build \
          --file myplaypit/myplaypit/Dockerfile \
          --tag ${{ secrets.ACR_LOGIN_SERVER }}/myplaypit:${{ github.sha }} \
          myplaypit

    - name: Push Docker image
      run: |
        docker push \
          ${{ secrets.ACR_LOGIN_SERVER }}/myplaypit:${{ github.sha }}


  deploy:
    name: Deploy to App Service
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: test

    permissions:
      id-token: write
      contents: read

    steps:
    - name: Login to Azure
      uses: azure/login@v3
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Diagnose Azure permissions
      run: |
        echo "=== Current identity ==="
        az account show \
          --query '{user:user, subscription:id, tenant:tenantId}' \
          -o json
    
        echo "=== Service principal ==="
        az ad sp show \
          --id "${{ secrets.AZURE_CLIENT_ID }}" \
          --query '{appId:appId, objectId:id, name:displayName}' \
          -o json
    
        echo "=== RBAC assignments ==="
        az role assignment list \
          --assignee "${{ secrets.AZURE_CLIENT_ID }}" \
          --all \
          --query '[].{role:roleDefinitionName,scope:scope,principalId:principalId}' \
          -o table
    
    - name: Check Azure identity
      run: az account show

    - name: Test App Service access
      run: |
        az webapp config appsettings list \
          --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
          --name "${{ secrets.AZURE_WEBAPP_NAME }}" \
          --output none

    - name: Update App Service container
      run: |
        az webapp config container set \
          --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
          --name "${{ secrets.AZURE_WEBAPP_NAME }}" \
          --container-image-name "${{ secrets.ACR_LOGIN_SERVER }}/myplaypit:${{ github.sha }}"
