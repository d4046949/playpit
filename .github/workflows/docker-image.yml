name: Docker Image CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  id-token: write
  contents: read
  actions: write

jobs:

  provision:
    name: Wake up ACI instance
    runs-on: ubuntu-latest

    steps:
       - name: Login to Azure
         uses: azure/login@v3
         with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

       - name: Test GitHub App
         env:
            GH_APP_ID: ${{ secrets.GH_APP_ID }}
            GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
         run: |
          echo "GitHub App ID is configured: ${GH_APP_ID}"
          echo "Private key is configured: ${#GH_APP_PRIVATE_KEY} characters"
      
       - name: Install PyJWT
         run: |
          python -m pip install PyJWT cryptography
          
       - name: Generate GitHub App JWT
         id: app-jwt
         env:
          GH_APP_ID: ${{ secrets.GH_APP_ID }}
          GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
         run: |
          python - <<'PY'
          import os
          import time
          import jwt

          app_id = os.environ["GH_APP_ID"]
          private_key = os.environ["GH_APP_PRIVATE_KEY"]

          now = int(time.time())

          token = jwt.encode(
              {
                  "iat": now - 60,
                  "exp": now + 540,
                  "iss": app_id,
              },
              private_key,
              algorithm="RS256",
          )

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"token={token}\n")
          PY

       - name: Get GitHub App installation ID
         id: app-installation
         env:
          GH_TOKEN: ${{ github.token }}
          APP_JWT: ${{ steps.app-jwt.outputs.token }}
         run: |
          INSTALLATION_ID=$(gh api \
            --header "Authorization: Bearer $APP_JWT" \
            repos/${{ github.repository }}/installation \
            --jq .id)

          echo "installation-id=$INSTALLATION_ID" >> "$GITHUB_OUTPUT"
          echo "Installation ID: $INSTALLATION_ID"
          
       - name: Check Azure
         run: az account show
          
       - name: Start ACI runner
         run: |
          az container start \
            --resource-group ${{secrets.AZURE_RESOURCE_GROUP}} \
            --name github-runner
          
  build:
    needs: provision
    runs-on: [self-hosted, dotnet10]
    name: Build and Push
    #runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Login to Azure
      uses: azure/login@v3
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    #- name: Login to Azure Container Registry
    #  run: |
     #   az acr login --name ${{ secrets.ACR_NAME }}

    #- name: Build Docker image
    #  run: |
    #    docker build \
    #      --file myplaypit/myplaypit/Dockerfile \
    #      --tag ${{ secrets.ACR_LOGIN_SERVER }}/myplaypit:${{ github.sha }} \
    #      myplaypit

    - name: Build and push Docker image
      run: |
        az acr build \
          --registry ${{ secrets.ACR_NAME }} \
          --image myplaypit:${{ github.sha }} \
          --file myplaypit/myplaypit/Dockerfile \
          myplaypit

    #- name: Push Docker image
    #  run: |
    #    docker push \
     #    ${{ secrets.ACR_LOGIN_SERVER }}/myplaypit:${{ github.sha }}


  deploy:
    name: Deploy to App Service
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: test

    permissions:
      id-token: write
      contents: read

    steps:
    - name: Login to Azure
      uses: azure/login@v3
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Diagnose Azure permissions
      run: |
        echo "=== Current identity ==="
        az account show \
          --query '{user:user, subscription:id, tenant:tenantId}' \
          -o json
    
        echo "=== Service principal ==="
        az ad sp show \
          --id "${{ secrets.AZURE_CLIENT_ID }}" \
          --query '{appId:appId, objectId:id, name:displayName}' \
          -o json
    
        echo "=== RBAC assignments ==="
        az role assignment list \
          --assignee "${{ secrets.AZURE_CLIENT_ID }}" \
          --all \
          --query '[].{role:roleDefinitionName,scope:scope,principalId:principalId}' \
          -o table
    
    - name: Check Azure identity
      run: az account show

    - name: Inspect Contributor role
      run: |
        az role definition list \
          --name Contributor \
          --query '[0].{name:roleName, actions:permissions[0].actions, notActions:permissions[0].notActions}' \
          -o json

    - name: Show target resource
      run: |
        echo "RG: ${{ secrets.AZURE_RESOURCE_GROUP }}"
        echo "WEBAPP: ${{ secrets.AZURE_WEBAPP_NAME }}"
    
        az resource show \
          --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
          --name "${{ secrets.AZURE_WEBAPP_NAME }}" \
          --resource-type "Microsoft.Web/sites" \
          --query '{id:id,name:name,type:type}' \
          -o json
          
    - name: Verify target App Service
      run: |
        az webapp show \
          --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
          --name "${{ secrets.AZURE_WEBAPP_NAME }}" \
          --query '{name:name,id:id,kind:kind}' \
          -o json
      
    - name: Test App Settings via ARM directly
      run: |
        az rest \
          --method POST \
          --url "https://management.azure.com/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${{ secrets.AZURE_RESOURCE_GROUP }}/providers/Microsoft.Web/sites/${{ secrets.AZURE_WEBAPP_NAME }}/config/appsettings/list?api-version=2025-05-01"

    - name: Test App Service access
      run: |
        az webapp config appsettings list \
          --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
          --name "${{ secrets.AZURE_WEBAPP_NAME }}" \
          --output none

    - name: Update App Service container
      run: |
        az webapp config container set \
          --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
          --name "${{ secrets.AZURE_WEBAPP_NAME }}" \
          --container-image-name "${{ secrets.ACR_LOGIN_SERVER }}/myplaypit:${{ github.sha }}"
